name: Package macOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: package-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test and type-check frontend
        working-directory: frontend
        run: |
          npm run test
          npm run check

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'from clash_traffic import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match application version v${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "dmg=Clash-Traffic-${version}-arm64.dmg" >> "${GITHUB_OUTPUT}"
          echo "zip=Clash-Traffic-${version}-arm64.app.zip" >> "${GITHUB_OUTPUT}"

      - name: Build docs and frontend
        run: |
          python build_docs.py
          python build_frontend.py

      - name: Build signed application
        env:
          CLASH_TRAFFIC_BUILD_NUMBER: ${{ github.run_number }}
        run: python build_macos.py --skip-frontend --work-dir work/native-build --output release

      - name: Create application archive and DMG
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG_NAME: ${{ steps.version.outputs.dmg }}
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          mkdir -p release/dmg-stage
          ditto -c -k --sequesterRsrc --keepParent \
            "release/Clash 流量簿.app" "release/${ZIP_NAME}"
          ditto "release/Clash 流量簿.app" "release/dmg-stage/Clash 流量簿.app"
          ditto docs "release/dmg-stage/文档"
          cp README.md LICENSE release/dmg-stage/
          ln -s /Applications release/dmg-stage/Applications
          cat > release/dmg-stage/安装与使用.txt <<EOF
          Clash 流量簿 ${VERSION}（Apple Silicon）

          将“Clash 流量簿.app”拖入 Applications 后打开。
          应用采用 ad-hoc 本地签名，尚未经过 Apple 公证。
          完整说明见“文档/index.html”。
          EOF
          hdiutil create -volname "Clash 流量簿" \
            -srcfolder release/dmg-stage -format UDZO -ov "release/${DMG_NAME}"
          (
            cd release
            shasum -a 256 "${DMG_NAME}" "${ZIP_NAME}" > SHA256SUMS.txt
          )

      - name: Verify package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG_NAME: ${{ steps.version.outputs.dmg }}
        run: |
          set -euo pipefail
          app="release/Clash 流量簿.app"
          codesign --verify --deep --strict "${app}"
          hdiutil verify "release/${DMG_NAME}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")" = "${VERSION}"
          file "${app}/Contents/MacOS/ClashTraffic" | grep -q arm64
          file "${app}/Contents/Resources/service/clash-traffic-service" | grep -q arm64
          (cd release && shasum -a 256 -c SHA256SUMS.txt)

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Clash-Traffic-${{ steps.version.outputs.version }}-arm64-${{ github.run_number }}
          path: |
            release/${{ steps.version.outputs.dmg }}
            release/${{ steps.version.outputs.zip }}
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          pattern: Clash-Traffic-*-arm64-${{ github.run_number }}
          path: release
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Clash 流量簿 ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
